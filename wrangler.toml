# SEAN: Self-Funded — Cloudflare Pages 設定
name = "sean-rpg"
compatibility_date = "2026-09-04"
pages_build_output_dir = "public"   # 只有 public/ 會被部署;db/、README 等不對外

# D1:存檔資料庫。database_id 由 `wrangler d1 create` 產生後填入。
[[d1_databases]]
binding       = "DB"            # 程式裡用 env.DB 取用
database_name = "sean-rpg-db"
database_id   = "cceefa0e-96f6-4aa7-9e7f-df0f89b2ea26"
